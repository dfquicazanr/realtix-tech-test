name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: End to end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/realtix-tech-test/browser/
          retention-days: 1

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to request the OIDC token that AWS trades for the role.
      id-token: write
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      BUCKET: realtix-tech-test-320764565541
      DISTRIBUTION: E1O8MT8BY5I4TA
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::320764565541:role/realtix-tech-test-deploy
          aws-region: us-east-1

      - name: Upload hashed assets
        run: |
          aws s3 sync dist s3://$BUCKET \
            --delete \
            --exclude index.html \
            --cache-control 'public,max-age=31536000,immutable'

      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html s3://$BUCKET/index.html \
            --cache-control no-cache \
            --content-type text/html

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION \
            --paths '/*'
