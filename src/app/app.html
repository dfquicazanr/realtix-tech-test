<div class="flex h-screen flex-col bg-slate-100 text-slate-900">
  <header class="flex items-baseline gap-3 border-b border-slate-300 bg-white px-4 py-3">
    <h1 class="text-lg font-semibold">Sismos M4.5+</h1>
    <p class="text-sm text-slate-500">Últimos 30 días, feed público de USGS</p>
    @if (store.status() === 'ready') {
      <p class="ml-auto text-sm text-slate-600" data-testid="visible-count">
        {{ store.visible().length }} de {{ store.quakes().length }}
      </p>
    }
  </header>

  @if (store.status() === 'error') {
    <p class="bg-red-50 px-4 py-2 text-sm text-red-700" role="alert">{{ store.error() }}</p>
  }

  <div class="flex min-h-0 flex-1">
    <aside class="flex w-96 shrink-0 flex-col border-r border-slate-300 bg-white">
      @if (store.status() === 'loading') {
        <p class="px-4 py-6 text-sm text-slate-500">Cargando sismos...</p>
      } @else {
        <div class="min-h-0 flex-1 overflow-y-auto">
          <app-quake-list />
        </div>
      }
    </aside>

    <main class="relative min-h-0 flex-1">
      <app-quake-map />
      <div class="pointer-events-none absolute top-3 right-3 z-10">
        <div class="pointer-events-auto">
          <app-quake-detail />
        </div>
      </div>
    </main>
  </div>
</div>
